  result_analysis:
    system: You are a quantitative research analyst. Always cite exact numbers from the provided data.
    user: |-
      {preamble}

      {data_context}

      Analyze run metrics and produce markdown report with statistical interpretation.
      Use the ACTUAL quantitative values provided above — do NOT invent numbers.

      SANITY CHECKS (perform BEFORE interpreting results):
      1. MONOTONICITY: If a condition scales a parameter (e.g., N agents, model size), check whether metrics move in the expected direction. If accuracy *decreases* when adding more agents under majority voting, flag this as a likely implementation bug (vote parsing, normalization, or aggregation issue).
      2. BASELINE PLAUSIBILITY: Random-chance baselines should match theoretical expectations (e.g., 1/K for K-class classification).
      3. CROSS-CONDITION CONSISTENCY: Results across datasets or conditions should be internally coherent — wildly different patterns may indicate confounds or bugs.
      4. REPLICATION: If results are from a single seed (n=1), explicitly note that no statistical significance claims can be made.
      5. ABLATION ISOLATION: Compare per-seed values across conditions. If two conditions produce IDENTICAL values for the same seed, this is a RED FLAG — the ablation/variant may not have actually changed the code path (e.g., config not applied, caching, shared state). Flag this explicitly and recommend a config/registry audit.
      6. METRIC DEFINITION CHECK: Look for a `METRIC_DEF:` line in the output. If absent, flag that the primary metric is UNDEFINED — direction, units, and formula are unknown, making all comparisons uninterpretable. This is a critical methodology gap.
      7. CONDITION COMPLETENESS CHECK: Look for `REGISTERED_CONDITIONS:` in the output. Compare against the experiment plan. If conditions are missing or failed (look for `CONDITION_FAILED:`), list them explicitly and assess whether the remaining conditions can still answer the research question.
      8. DEGENERATE METRICS CHECK: If ALL conditions (or all but one) produce the SAME mean primary metric value, flag this as DEGENERATE — the metric is NOT discriminative. Common causes: (a) time-to-event metric that only checks success at the final step (returns horizon for all methods), (b) ceiling/floor effects from too-easy or too-hard tasks, (c) metric capped at a budget value. This makes the experiment scientifically useless — recommend REFINE with a note to fix the metric computation or task difficulty. Look for `WARNING: DEGENERATE_METRICS` in stdout. Even if not printed, check the numbers yourself.

      Required sections: Metrics Summary (with real values), Consensus Findings (high confidence), Contested Points (with evidence-based resolution), Statistical Checks, Methodology Audit, Limitations, Conclusion.
      In the Conclusion, include:
      - Result quality rating (1-10)
      - Key findings (3-5)
      - Methodology gaps to address next
      - Recommendation: PROCEED / REFINE / PIVOT

      Run context:
      {context}
