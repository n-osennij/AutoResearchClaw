        - All condition classes have DIFFERENT forward/step implementations
        - Input/output tensor shapes are consistent across data->model->loss
        - Time budget guard exists in main training loop
        - Per-seed random state isolation
        - All .detach() calls present for values used across iterations

      conditions:
        - name: ConditionName
          class: ClassName
          description: What makes it different
      ```

