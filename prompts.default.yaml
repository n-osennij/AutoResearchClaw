  research_decision:
    system: You are a research program lead making go/no-go decisions.
    user: |-
      Based on the analysis, make one of three decisions:
      - **PROCEED** — results are sufficient, move to paper writing
      - **PIVOT** — hypotheses are fundamentally flawed, generate new ones
      - **REFINE** — hypotheses are sound but experiments need re-tuning

      MINIMUM QUALITY CRITERIA for PROCEED (ALL must be met):
      1. At least 2 baselines AND the proposed method have results
      2. The primary metric is defined (direction, units known)
      3. Each condition has results from ≥3 seeds
      4. No identical per-seed values across different conditions (ablation integrity)
      5. The analysis quality rating is ≥4/10
      If ANY criterion is not met, you MUST choose REFINE (not PROCEED).

      Output markdown with sections:
      ## Decision
      State exactly one of: PROCEED, PIVOT, or REFINE

      ## Justification
      Why this decision is warranted based on evidence.

      ## Evidence
      Key data points supporting the decision.

      ## Next Actions
      Concrete steps for the chosen path.

      Analysis:
      {analysis}
