# =============================================================================
# AutoResearchClaw — prompt override template (ml bank)
# =============================================================================
# GENERATED FILE — do not edit by hand if you want to stay in sync with the
# built-in prompts. Regenerate with:
#
#   python scripts/export_prompts.py --domain ml
#
# It mirrors the built-in bank exactly, so copying it and pointing config at the
# copy changes nothing:
#
#   prompts:
#     custom_file: "my_prompts.yaml"
#
# Edit only the stages/blocks you care about. Template variables use
# {var_name} syntax; unknown stage names are warned about and ignored.
# A stage entry replaces the whole `system` / `user` string of that stage.
# =============================================================================

blocks:
  title_guidelines: |2

    ## TITLE RULES (Hard Constraints)
    1. MAXIMUM 14 words. Ideal: 8-12 words. NEVER exceed 14.
    2. Preferred structure: 'MethodName: Descriptive Phrase' (colon format)
       - Create a catchy 1-3 word method name (acronym, portmanteau, or evocative word)
       - Subtitle explains what it does: 'for X' / 'via Y' / 'in Z'
       - Examples: 'AlphaEdit: Null-Space Knowledge Editing for LMs' (8 words)
       - Examples: 'VAR: Visual Autoregressive Modeling via Next-Scale Prediction' (8 words)
    3. Alternative: Bold declarative claim that surprises the reader
       - 'Not All Tokens Are What You Need for Pretraining' (9 words)
       - 'Vision Transformers Need Registers' (4 words)
    4. FORBIDDEN patterns:
       - 'Investigating...', 'An Empirical Study of...', 'Towards...'
       - 'A Novel Approach to...', 'On the...' (generic academic filler)
       - Repeating the full method description as title
       - Weakness qualifiers: 'in Two Runs', 'Under Limited Data'
    5. MUST define a short method name (2-5 chars) that serves as memorable handle.
       The reader should be able to say 'Have you read the X paper?'
    6. No abbreviations unless universally known (LLM, RL, GAN, NLP are OK).
  abstract_structure: |2

    ## ABSTRACT (Hard Rules — 180-220 words, 5-7 sentences)
    STRUCTURE (PMR+ format):
    S1-S2: PROBLEM — What gap exists? Why does it matter? (NO method names yet)
    S3-S4: METHOD — Name your system. One-sentence description of key insight.
    S5-S6: RESULTS — At most 3 specific numbers. Use relative improvements
      ('X% over baseline') not raw values ('0.7667'). Bold the single most
      important result.
    S7 (optional): IMPACT — What does this enable?

    HARD CONSTRAINTS:
    - NO \texttt{{}} in abstract
    - NO more than 3 numeric values in the entire abstract
    - NO per-seed breakdowns or confidence intervals
    - NO method names longer than 3 words (use the short system name)
    - The abstract must be readable by a researcher who skimmed only the title
    - First sentence must NOT start with 'We' or 'This paper'
  compute_budget: |2

    ## Compute Budget Constraint
    - Total execution time limit: {time_budget_sec} seconds
    - You MUST design experiments that complete within this budget
    - Estimate: a simple numpy loop runs ~10M iterations/sec; a nested loop over
      conditions runs proportionally slower
    - SCALING RULES (mandatory):
      - If total conditions > 100: reduce seeds to 3-5 (not 20)
      - If total conditions > 500: reduce to 2-3 representative conditions per factor
      - If time_budget < 300s: limit total optimization steps to ≤5,000 per run
      - If time_budget < 120s: limit total optimization steps to ≤1,000 per run
      - Always print intermediate results so partial data is captured on timeout
    - MANDATORY: print a 'TIME_ESTIMATE: Xs' line before the main loop,
      estimating total runtime based on a small pilot (run 1 condition, extrapolate)
    - MANDATORY: implement a time guard — check elapsed time periodically and
      stop gracefully if approaching 80% of budget, saving all results collected so far
    - MANDATORY: add NaN/divergence fast-fail guard:
      - After each optimization step, check if loss is NaN or > 100
      - If detected, print 'FAIL: NaN/divergence detected', save partial results, and exit
      - Do NOT waste compute on a diverging run
    - MINIMUM TRAINING EPOCHS (CRITICAL for meaningful results):
      - CIFAR-10/100 with ResNet/CNN: minimum 50 epochs (200 recommended)
      - FashionMNIST with small CNN: minimum 20 epochs
      - RL environments: follow the RL STEP BUDGET below (CRITICAL)
      - If time_budget is too short for minimum epochs, REDUCE model complexity
        or dataset size INSTEAD of reducing epochs. 8 epochs on CIFAR-10 will
        produce random-chance accuracy (~10%), making all comparisons meaningless.
      - Use a SMALL model (simple CNN, few layers) to fit enough epochs into the budget.
      - A converged small model is worth infinitely more than a diverged large model.
    - MANDATORY: use the experiment_harness module (pre-installed in sandbox):
      ```
      from experiment_harness import ExperimentHarness
      harness = ExperimentHarness(time_budget={time_budget_sec})
      # In your experiment loop:
      if harness.should_stop():
          break  # graceful stop at 80% of budget
      if not harness.check_value(value, 'metric_name'):
          print('SKIP: NaN/Inf detected')  # skip invalid values
          continue
      harness.report_metric('metric_name', value)  # validated output
      # At the end of ALL experiments:
      harness.finalize()  # writes results.json — MUST be called
      ```
      The harness provides: time budget enforcement, NaN/Inf detection,
      validated metric reporting, and results.json output. NOT using it
      means your metrics may be lost or malformed.
  topic_constraint: |2


    === HARD TOPIC CONSTRAINT ===
    The paper MUST be about: {topic}
    PROHIBITED content (unless user explicitly specifies case-study mode):
    - Do NOT treat environment setup, dependency installation, or infrastructure failures as a research contribution.
    - Do NOT present debugging logs, system errors, or configuration issues as experimental findings.
    - Do NOT drift to tangential topics not directly related to the stated topic.
    - Every section MUST connect back to the core research question.
    - The Abstract and Introduction MUST clearly state the research problem derived from: {topic}
    - The Method section MUST describe a technical approach, not a workflow.
    - The Results section MUST report quantitative outcomes of experiments, not environment status.
    === END CONSTRAINT ===
  pkg_hint_sandbox: |2

    AVAILABLE PACKAGES (sandbox mode): Python stdlib, numpy, math, random, statistics, json.
    Do NOT use: torch, tensorflow, jax, sklearn, pandas, scipy, matplotlib, or any deep learning framework.
    Write the experiment using ONLY numpy and stdlib.
  dataset_guidance: |2

    ## Standard Datasets & Real Baselines (MANDATORY when applicable)
    You MUST use real benchmark datasets — NEVER synthetic torch.randn() data.

    ### Tier 1: Pre-cached (ALWAYS available, use download=False)
    These datasets are already in the Docker image. Use download=False:
    - `torchvision.datasets.CIFAR10(root='/opt/datasets', train=True/False, download=False)`
    - `torchvision.datasets.CIFAR100(root='/opt/datasets', train=True/False, download=False)`
    - `torchvision.datasets.MNIST(root='/opt/datasets', train=True/False, download=False)`
    - `torchvision.datasets.FashionMNIST(root='/opt/datasets', train=True/False, download=False)`
    - `torchvision.datasets.STL10(root='/opt/datasets', split='train'/'test', download=False)`
    - `torchvision.datasets.SVHN(root='/opt/datasets', split='train'/'test', download=False)`

    ### Tier 2: Downloadable (use setup.py to download before main.py runs)
    For any dataset NOT in Tier 1, create a `setup.py` file that downloads it.
    setup.py runs WITH network access; main.py runs WITHOUT network.
    - Any torchvision dataset (Caltech-101, Flowers102, etc.)
    - HuggingFace datasets: `from datasets import load_dataset`
      Examples: IMDB, AG News, WikiText, SST-2, SQuAD, MMLU
    - OGB benchmarks: ogbg-molhiv, ogbn-arxiv, etc.
    - Tiny-ImageNet (237MB, 200 classes) — good ImageNet proxy

    ### Tier 3: Too large for download (use alternatives)
    These datasets are TOO LARGE to download within experiment time limits:
    - ImageNet-1K (168GB) → use Tiny-ImageNet or CIFAR-100 as proxy
    - LAION (>1TB) → use smaller HuggingFace image-text datasets
    - Common Crawl, The Pile → use WikiText-103 or pre-tokenized subsets
    NEVER generate 'ImageNet-like' synthetic data — always use a real alternative.

    ### ANTI-PATTERNS (NEVER DO THESE):
    - `torch.randn(N, 3, 224, 224)` as dataset → use real datasets
    - `download=True` in main.py → put downloads in setup.py
    - `download=False` for non-cached datasets → will FileNotFoundError
    - Random train/test splits → use official splits from dataset
    - `os.makedirs('/opt/datasets/...')` → /opt/datasets is READ-ONLY

    DATA PATH: For Tier 1 pre-cached datasets, use `/opt/datasets` as root.
    For Tier 2 datasets downloaded by setup.py, use `/workspace/data` as root.
    WARNING: `/opt/datasets` is READ-ONLY. NEVER call os.makedirs() on it.
    Just pass `root='/opt/datasets'` directly to torchvision dataset constructors.

    DISTRIBUTION SHIFT — use torchvision corruption transforms:
    - Gaussian noise: `transforms.Lambda(lambda x: x + torch.randn_like(x) * sigma)`
    - Brightness shift: `transforms.ColorJitter(brightness=0.5)`
    - Contrast shift: `transforms.ColorJitter(contrast=0.5)`
    - Blur: `transforms.GaussianBlur(kernel_size=5, sigma=(0.1, 2.0))`
    - For CIFAR-10-C style corruptions, apply transforms to test set only.

    REAL BASELINES & MODERN BENCHMARKS (CRITICAL):
    - Use proper train/test splits from the dataset (never split randomly in code)
    - Use standard architectures (ResNet-18/50, ViT, ConvNeXt) — not toy 2-layer MLPs
    - CIFAR INPUT SIZE (IMPORTANT): CIFAR images are 32×32. Two valid approaches:
      1. PRETRAINED models (ImageNet weights): Use `transforms.Resize(224)` — pretrained models require 224×224 inputs.
      2. TRAINING FROM SCRATCH (most experiments): Modify the model for 32×32 inputs instead of resizing. For ResNet: use `nn.Conv2d(3,64,3,1,1)` as first conv (not 7×7/stride-2) and REMOVE the initial MaxPool. This is 49× more memory-efficient and trains faster than Resize(224). Use the `timm` library's CIFAR variants or build a custom `get_resnet18_cifar()` helper.
    - Report standard metrics (top-1 accuracy for classification tasks)
    - Compare against published baselines where available
    - BASELINES MUST BE CURRENT: Use baselines from recent top-venue papers (2023-2026). Do NOT use outdated methods as the primary comparison.
      * AlexNet, VGG-16 → use ResNet-50, ViT, ConvNeXt instead
      * Vanilla SGD → use AdamW, SGD+momentum+cosine LR
      * Simple RNN/LSTM for NLP → use Transformer-based models
    - Include at LEAST one strong, modern baseline (near-SOTA).
    - BENCHMARKS MUST BE STANDARD and actively used in the community.

    WHEN TO USE SYNTHETIC DATA (required for these domains):
    - **PDE / Scientific computing**: Generate synthetic PDE data (Burgers equation, Darcy flow, heat equation, Navier-Stokes). Use numerical solvers (scipy.integrate, finite differences) to create ground truth.
    - **Combinatorial optimization** (TSP, graph coloring, scheduling): Generate random problem instances (random TSP cities, Erdos-Renyi graphs).
    - **Theoretical analysis**: Synthetic optimization landscapes, toy problems.
    - **Domain with no standard dataset**: Novel combinatorial or mathematical domains.
    For these domains, do NOT use CIFAR/MNIST/ImageNet — they are irrelevant. Generate problem-specific synthetic data in main.py.

    DOMAIN-DATASET MATCHING (CRITICAL):
    - Image classification → CIFAR-10/100, MNIST, ImageNet variants
    - NLP → IMDB, AG News, SST-2, WikiText
    - Graph learning → Cora, CiteSeer, ogbn-arxiv
    - PDE/Physics → SYNTHETIC (Burgers, Darcy, Navier-Stokes)
    - Combinatorial optimization → SYNTHETIC (random TSP, graph instances)
    - RL → Gymnasium environments (CartPole, LunarLander, HalfCheetah)
    NEVER use image datasets for non-image problems.
  setup_script_guidance: |2

    ## Setup Script (setup.py) — Dataset Download & Preparation
    If your experiment needs datasets NOT in the pre-cached list, generate a SEPARATE file called `setup.py` that downloads and prepares them.
    The setup.py runs WITH NETWORK ACCESS before main.py (which runs WITHOUT network).

    IMPORTANT: All download logic MUST be in setup.py, NOT in main.py.
    main.py should only load pre-cached data from /opt/datasets (download=False) or downloaded data from /workspace/data.

    Example setup.py:
    ```python
    import os
    DATA_DIR = '/workspace/data'
    os.makedirs(DATA_DIR, exist_ok=True)

    # Download torchvision datasets
    import torchvision
    torchvision.datasets.Caltech101(root=DATA_DIR, download=True)

    # Download HuggingFace datasets
    from datasets import load_dataset
    ds = load_dataset('imdb', cache_dir=os.path.join(DATA_DIR, 'hf'))

    # Download OGB benchmarks
    # from ogb.graphproppred import PygGraphPropPredDataset
    # dataset = PygGraphPropPredDataset(name='ogbg-molhiv', root=DATA_DIR)

    print('[setup] Dataset download complete.')
    ```

    IMPORT ANTI-PATTERN (NEVER DO THIS):
    ```python
    from datasets import load_dataset
    datasets.load_dataset('imdb', ...)  # WRONG — NameError!
    ```
    If you write `from datasets import load_dataset`, call `load_dataset(...)` directly.
    If you write `import datasets`, call `datasets.load_dataset(...)` with module prefix.
    NEVER mix the two styles.

    If ALL your datasets are pre-cached (CIFAR-10/100, MNIST, FashionMNIST, STL-10, SVHN), you do NOT need setup.py — just use download=False in main.py.

    You may also include a `requirements.txt` file listing any additional pip packages your experiment needs beyond the pre-installed set.
