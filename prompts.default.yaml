      4. **METRIC REPORTING**: Is {metric} correctly computed and printed in the required format?
      5. **ROBUSTNESS**: Shape mismatches? Missing imports? Type errors? Division by zero? GPU/CPU device conflicts?
      6. **CLASS DEPTH**: Each experimental condition class must have at least 20 lines of effective code with distinct logic. Classes that only override __init__ to change parameters are CRITICAL issues — they indicate the condition is not truly different.

      ## Output Format (JSON)
      ```json
      {{
        "verdict": "APPROVE or REVISE",
        "score": 1-10,
        "critical_issues": ["issue1", "issue2"],
        "suggestions": ["suggestion1", "suggestion2"]
      }}
      ```

      Only use verdict REVISE if there are critical issues that would cause the code to crash or produce scientifically invalid results.
