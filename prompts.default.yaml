      ## Blueprint Format (YAML)
      The blueprint MUST include ALL of the following for EACH file:
      - `generation_order`: integer (1=first to generate, higher=later)
      - `dependencies`: list of other files this file imports from
      - `classes` or `functions`: with pseudocode for each method
      - For neural network classes: input/output tensor shapes

      ```yaml
      files:
        - name: config.py
          generation_order: 1
          dependencies: []
          purpose: Hyperparameter configuration
          classes:
            - name: Config
              fields:
                - lr: 0.01
                - batch_size: 128
                - epochs: 20
                - hidden_dim: 128

        - name: data.py
          generation_order: 2
          dependencies: [config.py]
          purpose: Dataset loading and preprocessing
          functions:
            - name: get_dataloaders
              signature: (config) -> (train_loader, val_loader, test_loader)
              pseudocode: |
                1. Load dataset from torchvision/disk
                2. Apply standard transforms (normalize, augment)
                3. Split train into train/val (90/10)
                4. Return DataLoaders with config.batch_size

        - name: models.py
          generation_order: 3
          dependencies: [config.py]
          purpose: All model implementations
          classes:
            - name: BaseModel(nn.Module)
              input_shape: [B, 3, 32, 32]
              output_shape: [B, 10]
              methods:
                - name: __init__
                  pseudocode: Define layers (conv/linear/attention)
                - name: forward
                  pseudocode: |
                    1. x = self.encoder(x)  # [B,3,32,32] -> [B, hidden]
                    2. logits = self.classifier(x)  # [B, hidden] -> [B, 10]
                    3. return logits
            - name: ProposedMethod(BaseModel)
              differentiator: Uses novel component X
              overrides: [forward]
              methods:
                - name: forward
                  pseudocode: |
                    1. x = self.encoder(x)
                    2. x = self.novel_component(x)  # KEY DIFFERENCE
                    3. logits = self.classifier(x)
                    4. return logits
                - name: compute_special_loss
                  pseudocode: |
                    1. Compute task loss: CE(logits, labels)
                    2. Compute novel regularizer
                    3. return task_loss + lambda * reg

        - name: training.py
          generation_order: 4
          dependencies: [config.py, data.py, models.py]
          purpose: Training loop and evaluation
          functions:
            - name: train_one_epoch
              signature: (model, loader, optimizer, device) -> float
              pseudocode: |
                1. model.train()
                2. For each batch: forward, loss, backward, step
                3. Return average loss
            - name: evaluate
              signature: (model, loader, device) -> dict
              pseudocode: |
                1. model.eval() with torch.no_grad()
                2. For each batch: forward, argmax predictions
                3. Return {accuracy, loss}

        - name: main.py
          generation_order: 5
          dependencies: [config.py, data.py, models.py, training.py]
          purpose: Entry point — runs ALL conditions
          contract:
            prints_metric_def: true
            prints_registered_conditions: true
            runs_all_conditions: true
            per_seed_reporting: true
            time_budget_guard: true
          functions:
            - name: main
              pseudocode: |
                1. Print METRIC_DEF line
                2. Print REGISTERED_CONDITIONS
                3. Setup time budget guard
                4. For each condition:
                   a. Create model instance
                   b. For each seed:
                      - Set random seed
                      - Train model
                      - Evaluate and print per-seed metrics
                   c. Print mean/std across seeds
                5. Print SUMMARY comparison

