  network_full_guidance: |2

    ## Network Access: Full
    This experiment runs with network_policy='full'. Network access is available
    throughout ALL execution phases (setup, pip install, and main experiment).
    You may download datasets, install packages, and make HTTP requests at any time.
  hp_reporting: |2

    ## Hyperparameter Reporting (MANDATORY)
    At the TOP of main.py, define a HYPERPARAMETERS dictionary containing ALL tunable hyperparameters used in your experiment:
    ```python
    HYPERPARAMETERS = {
        'learning_rate': 0.001,
        'batch_size': 64,
        'num_epochs': 50,
        'hidden_dim': 256,
        # ... all other hyperparameters
    }
    ```
    At the end of main.py, save hyperparameters to results.json:
    ```python
    import json
    results = {'hyperparameters': HYPERPARAMETERS, 'metrics': collected_metrics}
    with open('results.json', 'w') as f:
        json.dump(results, f, indent=2)
    ```
    EVERY hyperparameter must be used in the code — no dead parameters.
    The paper MUST include a hyperparameter table — this data feeds into it.
  rl_step_guidance: |2

    ## RL Training Step Budget (MANDATORY for RL experiments)
    Reinforcement learning requires MANY more training steps than supervised learning.
    Under-trained RL agents produce random-chance performance, making ALL comparisons
    meaningless and the paper unpublishable.

    ### Environment Availability:
    #### Always available (classic control — no extra dependencies):
    - CartPole-v1, Pendulum-v1, MountainCar-v0, MountainCarContinuous-v0,
      Acrobot-v1, LunarLander-v3
    - These are lightweight and fast — PREFER these unless MuJoCo is specifically required.

    #### MuJoCo environments (pre-installed in Docker image):
    - HalfCheetah-v5, Hopper-v5, Walker2d-v5, Ant-v5, Humanoid-v5,
      Swimmer-v5, Reacher-v5, InvertedPendulum-v5, InvertedDoublePendulum-v5
    - Require MuJoCo runtime — available in Docker but NOT in basic sandbox mode.

    #### RULE: If the research topic says 'MuJoCo-free', 'without MuJoCo',
      or 'classic control only' → you MUST use classic control environments ONLY.
      Do NOT import or reference MuJoCo in any way.

    #### DEFAULT RECOMMENDATION: Prefer classic control environments unless the
      research topic specifically requires MuJoCo locomotion tasks.

    ### ALGORITHM-ENVIRONMENT COMPATIBILITY (HARD RULE — violation = crash):
    - DQN is ONLY for DISCRETE action spaces (CartPole, LunarLander, Acrobot, Atari).
      DQN will CRASH on Pendulum, HalfCheetah, Hopper, Walker2d, etc.
    - For CONTINUOUS action spaces: use SAC, TD3, or PPO.
    - PPO works for both discrete and continuous.
    - NEVER combine DQN + any continuous environment.

    ### TIME BUDGET RULES FOR RL:
    - If time_budget ≤ 3600s → ONLY classic control (CartPole, Pendulum, MountainCar, Acrobot, LunarLander)
    - If time_budget ≤ 1800s → ONLY CartPole or Pendulum (simplest)
    - MuJoCo requires >5000s for meaningful results.

    ### Minimum Steps by Algorithm Family:
    | Algorithm | Environment | Min Steps | Recommended |
    |-----------|-------------|-----------|-------------|
    | PPO       | MuJoCo (Ant, HalfCheetah, Humanoid) | 500K | 1M-3M |
    | PPO       | Simple control (CartPole, Pendulum) | 100K | 500K |
    | SAC/TD3   | MuJoCo locomotion | 300K | 1M |
    | SAC/TD3   | Simple control | 50K  | 200K |
    | DQN/Rainbow | Atari | 1M | 10M |
    | A2C/A3C   | Any continuous | 500K | 2M |
    | REINFORCE | Any | 200K | 1M |

    ### Step Budget Allocation Strategy:
    1. Compute pilot_time = time for 1000 steps of 1 condition.
    2. steps_per_sec = 1000 / pilot_time.
    3. max_steps_per_condition = (time_budget * 0.7) / num_conditions * steps_per_sec.
    4. If max_steps < min_steps for the algorithm, REDUCE num_seeds to 3 (not steps).
    5. If STILL under min_steps, use a simpler environment (e.g., Pendulum instead of Ant).
    6. NEVER reduce steps below the minimum — it wastes compute on meaningless results.

    ### Evaluation Protocol for RL:
    - Evaluate every N_eval steps (e.g., every 10K steps) using deterministic policy.
    - Run 10 evaluation episodes per checkpoint.
    - Report: mean return, std return, success rate (if applicable).
    - Plot learning curves (return vs steps) — this is EXPECTED by reviewers.
    - Final metric = mean over last 10 evaluation checkpoints (NOT last episode).

    ### Gymnasium Environment Version (CRITICAL):
    - Use v5 environments (NOT v4): `gym.make('HalfCheetah-v5')`, `gym.make('Hopper-v5')`
    - v4 environments are deprecated and will produce warnings.
    - Available MuJoCo v5 envs: HalfCheetah-v5, Hopper-v5, Walker2d-v5, Ant-v5,
      Humanoid-v5, Swimmer-v5, Reacher-v5, InvertedPendulum-v5, InvertedDoublePendulum-v5
    - For simple/fast experiments: use Pendulum-v1, CartPole-v1, MountainCarContinuous-v0

    ### Gymnasium API (CRITICAL — common crash source):
    - `env.reset()` returns `(obs, info)` — ALWAYS unpack both:
      `obs, info = env.reset(seed=seed)`
    - `env.step(action)` returns `(obs, reward, terminated, truncated, info)` — 5 values:
      `obs, reward, terminated, truncated, info = env.step(action)`
      `done = terminated or truncated`
    - DO NOT use old `done = env.step(action)[2]` — this is the Gym (v0.26-) API.
    - `reward` is a scalar float, NOT an array. Do NOT index it: use `reward` directly.
    - `obs` shape depends on env: discrete envs give 1D array, image envs give 3D.
      Always check `env.observation_space.shape` and handle accordingly.

    ### Learning Curve Logging (MANDATORY for RL papers):
    - Print evaluation metrics at regular intervals: every N_eval steps
      `EVAL: step=<S> condition=<C> seed=<seed> return=<R>`
    - This enables plotting learning curves (return vs training steps)
    - Learning curves are EXPECTED by RL reviewers — a paper without them
      will be rejected regardless of final performance.
    - At the end, print the full curve:
      `LEARNING_CURVE: condition=<C> seed=<seed> steps=[...] returns=[...]`
  multi_seed_enforcement: |2

    ## Multi-Seed Experiment Requirement (MANDATORY — NO EXCEPTIONS)
    Running each condition with only 1 seed is NEVER acceptable. Results from
    a single seed cannot distinguish signal from noise and reviewers will reject.

    ### HARD REQUIREMENT:
    - You MUST use exactly seeds = [0, 1, 2] (3 seeds minimum).
    - Each condition MUST loop over ALL seeds.
    - Print per-seed: `condition=X seed=S {metric_key}: V`
    - Print aggregated: `condition=X {metric_key}_mean: M {metric_key}_std: S`
    - Tables MUST show mean ± std, NEVER single-run values.

    ### Implementation Pattern (copy this structure):
    ```python
    SEEDS = [0, 1, 2]  # EXACTLY 3 seeds — mandatory minimum
    all_results = {}  # {condition_name: {seed: metric_value}}

    for condition_name, ConditionClass in conditions.items():
        all_results[condition_name] = {}
        for seed in SEEDS:
            set_all_seeds(seed)  # torch, numpy, random
            result = run_single(ConditionClass, seed=seed)
            all_results[condition_name][seed] = result
            print(f'condition={condition_name} seed={seed} metric: {result}')
        values = list(all_results[condition_name].values())
        print(f'condition={condition_name} metric_mean: {np.mean(values):.4f} '
              f'metric_std: {np.std(values):.4f}')
    ```

    ### Reporting Requirements:
    - Print per-seed results: `condition=X seed=S metric: V`
    - Print aggregated: `condition=X metric_mean: M metric_std: S`
    - Tables in the paper MUST show mean ± std, NEVER single-run values.
    - If time budget forces < 5 seeds, use EXACTLY 3 seeds (minimum).
      Print: `SEED_WARNING: only 3 seeds used due to time budget`.
  writing_structure: |2

    ## Paper Section Writing Rules
    MARKDOWN FORMATTING (CRITICAL):
    - Use `# Title` (H1) for the paper title
    - Use `# Abstract`, `# Introduction`, `# Method`, etc. (H1) for MAIN sections
    - Use `## Subsection Name` (H2) for subsections WITHIN a main section
    - NEVER use `##` for main sections — that produces wrong LaTeX heading levels
    - Each main section (H1) MUST contain subsections (H2) when it exceeds 3 paragraphs
    - NEVER place sub-topics (e.g., 'Knowledge Distillation for Compact Models') at the same heading level as main sections (e.g., 'Related Work')
    - NEVER wrap the paper in ```markdown fences
    - NEVER use raw variable names (e.g., `method_name/metric_key = 0.85`) — always use human-readable text

    ABSTRACT (150-200 words, 5-sentence structure):
    - (1) Problem and significance (2) Prior approaches and gaps
    - (3) Your approach and novelty (4) Key results with 2-3 specific numbers
    - (5) Implication/takeaway
    - Do NOT list per-seed ranges (e.g., '0.71-0.73 across seeds') — use mean +/- std
    - Do NOT repeat numbers that appear in the Results section — pick the 2-3 most impactful

    INTRODUCTION (4 paragraphs, 800-1000 words, cite 8-12 references):
    Paragraph 1: Problem motivation (why this matters). Paragraph 2: What exists and why it falls short. Paragraph 3: Your approach and key insight. Paragraph 4: Contributions (2-3 bullet points allowed here ONLY).

    RELATED WORK:
    Organize by sub-topic, not chronologically. End each paragraph with how YOUR work differs from the cited work. Cite at least 15 references, all directly relevant.

    METHOD:
    Write as flowing narrative prose (NOT bullet points). Include full algorithm description with pseudocode or step-by-step. State all hyperparameters with values and justification. Provide architecture details sufficient for reproduction.

    RESULTS:
    - Do NOT repeat the same number more than twice across the paper
    - Each number in a table should be discussed AT MOST once in text
    - Tables: mean +/- std with 95% CI in parentheses
    - Bold the best result in each column
    - Every comparison claim must cite a p-value or note multiple seeds
    - Report the number of random seeds/runs used

    FIGURES AND TABLES:
    - Every figure MUST be referenced in the text (e.g., 'As shown in Figure 1')
    - Every table MUST be referenced in the text (e.g., 'Table 2 summarizes')
    - Figure captions: 1-2 descriptive sentences (not just 'Results comparison')
    - Table captions go ABOVE the table; figure captions go BELOW the figure
    - Axis labels must include units where applicable
    - Use consistent font sizes across all figures

    DISCUSSION (if applicable, can be merged into Results):
    - Paragraph 1: Summarize key findings and their significance
    - Paragraph 2: Compare with prior work — explain WHY results differ
    - Paragraph 3: Discuss unexpected or negative results honestly
    - Paragraph 4: Broader implications and practical applications

    LIMITATIONS (3-5 points):
    - State each limitation ONCE, here only — not scattered throughout
    - No disclaimers like 'due to computational constraints'
    - Include compute resources used (GPU type, training time)

    CONCLUSION:
    - Summarize findings (match actual results, no aspirational claims)
    - 2-3 sentences of future work

    PROSE QUALITY (CRITICAL — violation = desk reject):
    - Write FLOWING ACADEMIC PARAGRAPHS, not bullet-point lists.
    - Each paragraph must have 4-8 sentences with smooth transitions.
    - Introduction, Related Work, and Method must each be >=3 paragraphs.
    - FORBIDDEN: starting 3+ consecutive paragraphs with the same word.
    - FORBIDDEN: bullet-point lists in Introduction or Related Work sections.
    - Use varied sentence structures: mix simple, compound, and complex sentences.
    - Connect paragraphs with transition phrases: 'Building on this insight...', 'In contrast to prior work...', 'To address this limitation...'.
    - Each Related Work paragraph must COMPARE your approach to cited work, not merely summarize what each paper does.
    - FORBIDDEN AI-BOILERPLATE phrases (instant credibility loss):
      'delves into', 'it is worth noting', 'plays a crucial role',
      'leverages the power of', 'paves the way', 'a myriad of',
      'paradigm shift', 'groundbreaking', 'in the realm of',
      'holistic approach', 'multifaceted', 'navigate the complexities'.
      Replace ALL such phrases with precise, specific academic language.
  llm_training_guidance: |2

    ## LLM Fine-Tuning Guidance (when topic involves language model training)
    AVAILABLE FRAMEWORKS (pre-installed in Docker):
    - transformers (AutoModelForCausalLM, AutoTokenizer, Trainer)
    - peft (LoraConfig, get_peft_model, PeftModel)
    - trl (SFTTrainer, DPOTrainer, GRPOTrainer)
    - datasets (load_dataset, Dataset)
    - accelerate (Accelerator)
    - bitsandbytes (4-bit/8-bit quantization)

    GPU MEMORY GUIDELINES (RTX 6000 Ada, 49GB VRAM):
    - Full fine-tune: <=3B parameters
    - LoRA (16-bit): <=14B parameters
    - QLoRA (4-bit): <=72B parameters (practical limit ~14B for training)
    - Optimal: 7B-14B model with QLoRA (rank 16-64)

    RECOMMENDED TRAINING PATTERN:
    ```python
    from transformers import AutoModelForCausalLM, AutoTokenizer, BitsAndBytesConfig
    from peft import LoraConfig, get_peft_model, TaskType
    from trl import SFTTrainer, SFTConfig
    from datasets import load_dataset

    # 4-bit quantization for memory efficiency
    bnb_config = BitsAndBytesConfig(
        load_in_4bit=True,
        bnb_4bit_quant_type='nf4',
        bnb_4bit_compute_dtype=torch.bfloat16,
    )
    model = AutoModelForCausalLM.from_pretrained(
        model_name, quantization_config=bnb_config, device_map='auto'
    )
    lora_config = LoraConfig(
        r=16, lora_alpha=32, target_modules='all-linear',
        lora_dropout=0.05, task_type=TaskType.CAUSAL_LM,
    )
    model = get_peft_model(model, lora_config)
    ```

    KEY HYPERPARAMETERS:
    - learning_rate: 1e-4 to 2e-4 (LoRA), 5e-5 to 1e-4 (full FT)
    - lora_r: 8 (minimal) to 64 (high-capacity)
    - lora_alpha: typically 2x lora_r
    - batch_size: 1-4 per device (use gradient_accumulation_steps for effective batch)
    - gradient_accumulation_steps: 4-16 (effective_batch = per_device * accum)
    - max_seq_length: 512 (short), 1024-2048 (standard), 4096 (long)
    - warmup_ratio: 0.03-0.1
    - weight_decay: 0.01-0.1

    DATA FORMAT (use datasets library):
    - Instruction tuning: {'instruction': '...', 'output': '...'}
    - Chat format: {'messages': [{'role': 'user', 'content': '...'}, ...]}
    - DPO: {'prompt': '...', 'chosen': '...', 'rejected': '...'}
    - Use load_dataset('json', data_files='train.json') for local data
    - Use load_dataset('HuggingFace/dataset_name') for HF Hub datasets

    EVALUATION:
    - Use evaluate library for standard metrics
    - Common: perplexity, ROUGE (summarization), BLEU (translation), accuracy
    - LLM benchmarks: MMLU, ARC, HellaSwag, TruthfulQA
    - Generate sample outputs for qualitative comparison

    MODEL DOWNLOAD:
    - Models will be downloaded from HuggingFace Hub at runtime
    - Use 'trust_remote_code=True' for custom model architectures
    - Cache directory: default HF cache (~/.cache/huggingface)
    - Common models: Qwen/Qwen2.5-7B, meta-llama/Llama-3.1-8B, microsoft/Phi-4, google/gemma-2-9b

    CRITICAL — NO SIMULATION:
    - You MUST load and train a REAL model from HuggingFace Hub.
    - NEVER simulate training with synthetic utility functions or random scores.
    - NEVER replace model training with np.random/torch.randn mock results.
    - A real experiment loads a model, tokenizes data, runs optimizer steps, and measures real loss/perplexity/accuracy on held-out data.
    - If compute budget is tight, use a SMALLER model (Qwen2.5-0.5B or 1.5B) with fewer training steps rather than simulating.
  llm_eval_guidance: |2

    ## LLM Evaluation Guidance
    STANDARD BENCHMARKS:
    - Reasoning: MMLU, ARC-Challenge, HellaSwag, WinoGrande
    - Math: GSM8K, MATH, MathVista
    - Coding: HumanEval, MBPP, LiveCodeBench
    - Safety: TruthfulQA, BBQ, CrowS-Pairs
    - Instruction following: MT-Bench, AlpacaEval, IFEval
    - Multimodal: MMBench, POPE, MathVista, MMMU

    EVALUATION FRAMEWORKS:
    - lm-eval-harness: Standard eval framework, run via CLI or Python API
    - vllm: Fast inference engine for throughput-focused evaluation
    - lighteval: HuggingFace's lightweight eval framework

    EVALUATION PROTOCOL:
    - Report on at least 3 benchmarks relevant to the task
    - Compare with published baselines from model cards/leaderboards
    - Report both zero-shot and few-shot results where applicable
    - Include perplexity on held-out test set
  academic_style_guide: |2

    ## ACADEMIC WRITING STANDARDS (from NeurIPS/ICLR/ICML 2024-2025 best papers)

    ### Title Standards
    - Target 8-14 words. Median of award-winning papers: ~10 words.
    - Preferred format: 'SystemName: Descriptive Subtitle' (35% of best papers)
      e.g., 'AlphaEdit: Null-Space Constrained Knowledge Editing for Language Models'
    - Alternative: Declarative statement that surprises
      e.g., 'Not All Tokens Are What You Need for Pretraining'
    - Give your method a memorable, catchy name (VAR, Genie, PRISM, SEDD).
    - NEVER exceed 18 words. NEVER use 'A Novel Approach to...' or 'Investigating...'

    ### Abstract Standards (PMR+ Structure, 180-220 words)
    S1-S2: PROBLEM — State the gap. Open with a challenge or status-quo critique.
    S3-S4: METHOD — Name your system by sentence 3. Describe the key insight.
    S5-S6: RESULTS — At least 2-3 concrete quantitative claims:
      - One relative improvement ('36.7% boost over baseline')
      - One absolute benchmark score ('FID of 1.01 on ImageNet')
    AVOID: Per-seed ranges, excessive texttt, defensive hedging.

    ### Section Writing Standards
    INTRODUCTION (800-1000 words, 4 paragraphs):
      - Para 1: Motivation; Para 2: Gap (cite 3-5 papers); Para 3: Your approach;
        Para 4: Contributions (bullet list of 3-4 specific contributions)
      - MUST cite 8-12 references throughout Introduction

    RELATED WORK (600-800 words):
      - Organize by sub-topic (2-3 subsections), NOT as a flat list
      - End each subsection with how YOUR work differs
      - Target >= 15 unique references in this section alone

    METHOD (1000-1500 words):
      - Start with problem formulation (notation, objective function)
      - Use algorithm environment for pseudocode (not verbatim)
      - Write as a flowing narrative, NOT bullet points

    EXPERIMENTS (800-1200 words):
      - Experimental setup as subsection (datasets, baselines, metrics, hardware)
      - Hyperparameter table (Table 1 always)
      - MUST reference figures: 'As shown in Figure 1, our method...'
      - MUST cite baseline method papers (not just name them)

    RESULTS (600-800 words):
      - Main results table with descriptive caption
      - Ablation study table
      - Analysis paragraphs connecting numbers to insights
      - DO NOT repeat the same numbers from Experiments section
      - Reference figures for visual evidence

    DISCUSSION (400-600 words):
      - Compare findings with prior work (cite papers here!)
      - Explain surprising results; broader implications

    LIMITATIONS (200-300 words): 3-5 specific, concrete limitations. ALL caveats go HERE.

    CONCLUSION: Summarize in 2-3 sentences, future work in 2-3 sentences.

    ### Writing Quality Rules
    - Write as FLOWING PROSE, not bullet points or enumerated lists
    - Each paragraph: topic sentence, evidence, analysis, transition
    - Use transitions: 'Building on this insight...', 'In contrast to...'
    - Academic tone: confident but precise
    - Vary sentence structure: mix short declarative with longer analytical
    - AVOID: Starting 3+ consecutive sentences with 'We', 'The', 'Our'
    - AVOID: 'It is worth noting that', 'It should be mentioned that' (filler)
    - Citations belong in EVERY section, not just Introduction and Related Work
  narrative_writing_rules: |2

    ## NARRATIVE WRITING REQUIREMENTS

    You are writing a paper for human reviewers at a top AI conference. The paper
    must read like a cohesive academic story, NOT a technical report or bullet list.

    ### Structure of Each Paragraph
    Every paragraph MUST follow this pattern:
    1. TOPIC SENTENCE — states the main claim or finding
    2. EVIDENCE — data, citations, or reasoning that supports the claim
    3. ANALYSIS — what the evidence means, why it matters
    4. TRANSITION — connects to the next paragraph's topic

    ### FORBIDDEN Writing Patterns
    - Bullet-point lists in the main body (ONLY allowed in Contributions paragraph
      of Introduction and Limitations section)
    - Numbered lists of findings or results
    - Starting a paragraph with 'Table X shows...' without context first
    - Consecutive short sentences without analysis between them
    - Repeating the same sentence structure 3+ times in a row

    ### REQUIRED Writing Patterns
    - Transition phrases: 'Building on this observation...', 'In contrast to prior work...'
    - Vary sentence length: alternate between short impactful and longer analytical
    - Ground every claim in evidence: '[Result] because [mechanism] (cite)'
    - Discuss implications: 'This X% improvement indicates that [mechanism Y]
      is more effective than [mechanism Z] for [context]'
    - For temporal data: describe trends in prose rather than bullet-point lists

    ### Example: BAD vs GOOD Method Description
    BAD (bullet-list style):
      'Our method has three components:
       - Component A
       - Component B
       - Component C'

    GOOD (narrative style):
      'Our method builds on the insight that [core problem] stems from
       [root cause identified in Section 2]. To address this, we introduce
       [MethodName], a [N]-stage framework. First, [Stage 1] maps inputs
       to [representation]. These representations feed into [Stage 2],
       enabling [benefit] without [drawback of prior approaches].
       Crucially, we augment this with [Stage 3] based on [technical
       foundation] (cite original paper), triggering [mechanism] when
       [condition is met].'
      NOTE: Replace all [placeholders] with YOUR actual method details.
      Do NOT copy this template verbatim.
  anti_hedging_rules: |2

    ## ANTI-HEDGING RULES (MANDATORY)
    1. The following phrases are BANNED from the paper body:
       - 'we do not claim' / 'we cannot claim'
       - 'we intentionally frame this conservatively'
       - 'the evidence does not support' (unless followed by what it DOES support)
       - 'only N seeds/runs' (belongs ONLY in Limitations, stated ONCE)
       - 'this paper is not' / 'we do not' as paragraph openers
    2. Limitations and caveats MUST be consolidated in the Limitations section.
       They may NOT appear in Introduction, Method, Results, or Conclusion.
    3. Confidence framing: Instead of 'we cannot prove X', write 'our results
       provide evidence for X' or 'X is supported by [metrics]'.
    4. If you have a negative result, frame it as an INSIGHT:
       BAD: 'Our method failed to outperform the baseline, we do not claim...'
       GOOD: 'Surprisingly, the standard baseline proved competitive, suggesting
       that [insight about why] — an observation with practical implications for...'
  anti_repetition_rules: |2

    ## ANTI-REPETITION RULE
    Each specific number (e.g., '0.7667', '36.7%') may appear in AT MOST 2 sections:
      - Once in Results/Experiments (where it is first reported)
      - Once in Abstract (as a summary highlight)
    The Introduction, Discussion, and Conclusion MUST refer to results qualitatively
    ('significantly outperformed', 'X% improvement') WITHOUT repeating exact numbers
    from the Results section. Violation of this rule will result in desk rejection.
stages:
  topic_init:
    system: |-
      You are a rigorous research planner who identifies NOVEL, TIMELY research angles. You follow recent trends from top venues in the relevant domain and propose research that advances the frontier rather than repeating known results.

      NOVELTY PRINCIPLES:
      - A good research angle addresses a GAP not yet covered by existing work.
      - Avoid pure benchmark/comparison studies unless the methodology is novel.
      - Prefer angles that combine existing techniques in new ways, apply methods to underexplored domains, or challenge common assumptions.
      - The research must be FEASIBLE with limited compute (single GPU, hours not days).
      - Check: would a reviewer say 'this is already well-known'? If so, find a sharper angle.
    user: |-
      Create a SMART research goal in markdown.
      Topic: {topic}
      Domains: {domains}
      Project: {project_name}
      Quality threshold: {quality_threshold}

      Required sections:
      - **Topic**: The broad area
      - **Novel Angle**: What specific aspect has NOT been well-studied? Why is this timely? What recent development creates an opportunity? How does this differ from standard approaches?
      - **Scope**: Focused enough for a single paper
      - **SMART Goal**: Specific, Measurable, Achievable, Relevant, Time-bound
      - **Constraints**: Compute budget, available tools, data access
      - **Success Criteria**: What results would make this publishable?
      - **Generated**: Timestamp

      IMPORTANT: The 'Novel Angle' section must convincingly argue why this specific research direction is NOT already covered by existing work. If the topic is well-studied (e.g., 'comparing optimizers'), you MUST find a specific unexplored aspect (e.g., 'under distribution shift with noisy gradients', 'in the few-shot regime', 'with modern architectures').

      TREND VALIDATION (MANDATORY):
      - Describe the research trend or gap that motivates this work. Do NOT fabricate specific paper titles or citations — actual papers will be retrieved in the literature search stage.
      - Name the specific benchmark/dataset that will be used for evaluation.
      - If no standard benchmark exists, explain how results will be measured.
      - Note whether SOTA results are commonly tracked on this benchmark (do NOT state specific model names or performance numbers — these will be verified in the literature search stage).
      - Add a 'Benchmark' subsection listing: name, source, and typical metrics — omit unverified performance numbers.
  problem_decompose:
    system: You are a senior research strategist.
    user: |-
      Decompose this research problem into at least 4 prioritized sub-questions.
      Topic: {topic}
      Output markdown with sections: Source, Sub-questions, Priority Ranking, Risks.
      Goal context:
      {goal_text}
  search_strategy:
    system: You design literature retrieval strategies and source verification plans.
    user: |-
      Create a merged search strategy package.
      Return a JSON object with keys: search_plan_yaml, sources.

      search_plan_yaml MUST be valid YAML text that INCLUDES this required query block (additional non-query metadata fields are allowed alongside it):

        topic: <YOUR_TOPIC>
        search_strategies:
          - name: <CATEGORY_LABEL_1>
            queries:
              - <SHORT_QUERY_1>
              - <SHORT_QUERY_2>
          - name: <CATEGORY_LABEL_2>
            queries:
              - <SHORT_QUERY_3>
              - <SHORT_QUERY_4>

      Requirements:
      - At least 3 strategies. Each strategy MUST have 3-5 queries.
      - At least 8 total queries across all strategies.
      - Each query MUST be a plain string of 3-6 words.
      - Cover: core topic, related methods, benchmarks/datasets, theoretical foundations, applications.
      - Additional fields such as `filters`, `sources`, `max_results_per_query`, `deduplication`, `date_window`, or per-strategy metadata may appear alongside the required block.

      STRICT — all actual search queries MUST live only under `search_strategies[].queries`. Do NOT place queries elsewhere:
      - Do NOT use `query_strategies`, `sub_question_map`, `sub_questions`, or a top-level `queries:` list.
      - Do NOT use `keyword_groups`, `boolean_seeds`, `keywords`, `seeds`, or `search_terms` as the query list.
      - Each query MUST be a plain string, not a dict like `{id: Q1, string: ...}`.

      sources must include id,name,type,url,status,query,verified_at.
      Topic: {topic}
      Problem tree:
      {problem_tree}
    json_mode: true
  literature_collect:
    system: You are a literature mining assistant.
    user: |-
      Generate candidate papers from the search plan.
      Return JSON: {candidates:[...]} with >=8 rows.
      Each candidate must include id,title,source,url,year,abstract,collected_at.
      Topic: {topic}
      Search plan:
      {plan_text}
    json_mode: true
  literature_screen:
    system: You are a strict domain-aware reviewer with zero tolerance for cross-domain false positives.
      You MUST reject papers that are from unrelated fields, even if they share superficial keyword overlap.
      A paper about 'normalization in database systems' is NOT relevant to 'normalization in deep learning'.
      A paper about 'graph theory in social networks' is NOT relevant to 'graph neural networks for molecular
      property prediction'.
    user: |-
      Perform merged relevance+quality screening and return shortlist.
      Return JSON: {shortlist:[...]} each with title, cite_key (if present), relevance_score (0-1), quality_score (0-1), keep_reason.
      Preserve all original fields (paper_id, doi, arxiv_id, cite_key, pmid, is_preprint, pub_types, concern, etc.) from the input.
      Papers tagged year_band="foundational" predate the recent window (research.min_year): keep them only when they define the problem, a metric, or a baseline; otherwise prefer recent work.
      Topic: {topic}
      Domains: {domains}
      Threshold: {quality_threshold}

      SCREENING RULES (apply strictly):
      1. DOMAIN MATCH: The paper's actual research domain must match the topic's domain. Shared keywords across domains do NOT count.
      2. METHOD RELEVANCE: The paper must discuss methods, benchmarks, or findings directly applicable to the research topic.
      3. CROSS-DOMAIN REJECTION: Reject papers from unrelated fields (e.g., wireless communications, database systems, social science) even if they use similar terminology.
      4. RECENCY PREFERENCE: Prefer papers from 2020+ for methodology, but accept foundational papers (pre-2020) if they introduced key techniques still in use today.
      5. SEMINAL PAPERS: Papers marked as source='seminal_library' are pre-vetted foundational references — keep them if their keywords match the topic (relevance_score >= 0.7).
      6. QUALITY FLOOR: Reject papers with no abstract, no venue, and no citation count (likely not real papers).
      7. EVIDENCE LEVEL: Record, do not guess. Keep is_preprint=true papers when they are the primary source (bioRxiv/medRxiv/arXiv), but treat their claims as unverified. A paper with retracted=true or concern=true is citable evidence of a problem, not evidence for the topic — keep it only if the review is about that failure, and always echo the flag.
      Candidates JSONL:
      {candidates_text}
    json_mode: true
    max_tokens: 8192
  knowledge_extract:
    system: You extract high-signal evidence cards from papers.
    user: |-
      Extract structured knowledge cards from shortlist.
      Return JSON: {cards:[{card_id,title,cite_key,problem,method,data,metrics,findings,limitations,citation}]}.
      IMPORTANT: If the input contains cite_key fields, preserve them exactly in the output.
      Do not invent pmid, doi, year or venue: leave them out — they are copied from the source record downstream.
      Shortlist:
      {shortlist}
    json_mode: true
  synthesis:
    system: You are a synthesis specialist for literature reviews.
    user: |-
      Produce merged synthesis output (topic clusters + research gaps).
      Output markdown with sections: Cluster Overview, Cluster 1..N, Gap 1..N, Prioritized Opportunities.
      When a finding rests only on a preprint (bioRxiv/medRxiv/arXiv), say so and label it unverified — never present it as peer-reviewed. State the evidence level (preprint, randomised trial, systematic review, cohort, in-vitro) wherever it changes how much weight a claim deserves.
      Topic: {topic}
      {domain_context}
      Cards context:
      {cards_context}
    max_tokens: 8192
  hypothesis_gen:
    system: |-
      You formulate testable scientific hypotheses that address gaps NOT covered by existing literature. Your hypotheses must be:
      1. NOVEL: Not simply replicating known results or testing obvious things.
      2. GAP-FILLING: Address specific weaknesses or blind spots identified in the literature synthesis.
      3. FEASIBLE: Testable within the constraints of this research domain.
      {feasibility_constraint}4. FALSIFIABLE: Have clear failure conditions that would definitively reject the hypothesis.
      5. SURPRISING: At least one hypothesis should challenge conventional wisdom or test a counter-intuitive prediction.
    user: |-
      Generate at least 2 falsifiable hypotheses from the synthesis below.
      For each hypothesis provide:
      - **Hypothesis statement**: A clear, testable claim
      - **Novelty argument**: Why this has NOT been tested before, citing specific gaps from the synthesis
      - **Rationale**: Theoretical or empirical basis for expecting this result
      - **Measurable prediction**: Specific quantitative outcome expected
      - **Failure condition**: What result would reject this hypothesis?
      - **Required baselines**: What modern, state-of-the-art methods must be compared against to make the finding meaningful?

      AVOID:
      - Hypotheses that are trivially obvious
      - Hypotheses that replicate well-known results already in the literature
      - Hypotheses that cannot be tested within the domain's feasibility constraints

      {domain_context}Synthesis:
      {synthesis}
  experiment_design:
    system: You are a principal investigator designing rigorous research experiments.
    user: |-
      {preamble}

      {domain_design_context}Design an experiment plan as YAML.
      Required keys: objectives,datasets,baselines,proposed_methods,ablations,metrics,risks,compute_budget.

      NAMING REQUIREMENT (CRITICAL for paper quality):
      - Every condition name in baselines, proposed_methods, and ablations MUST be a DESCRIPTIVE algorithm name DERIVED FROM THE HYPOTHESES ABOVE, NOT a generic label.
      - WRONG: baseline_1, baseline_2, method_variant_1, method_variant_2
      - WRONG: random_search, bayesian_optimization, ppo_policy, curiosity_driven_rl (these are generic defaults — NEVER use them unless they are actually what the hypotheses call for)
      - RIGHT: names that reflect the specific methods/architectures/algorithms in the hypotheses (e.g., rim_agent, monolithic_gru, ewc_baseline, sleep_consolidation, no_sleep_ablation, coarse_routing, fine_routing)
      - The name should immediately tell a reader WHAT algorithm or strategy is used.
      - This is critical because these names appear directly in the paper.

      BASELINE & BENCHMARK MODERNITY (CRITICAL for acceptance):
      - Baselines MUST be modern, widely-adopted methods from recent top-venue papers (2023-2026). Beating only outdated or weak baselines is NOT a valid contribution and will result in desk rejection.
      - Include at LEAST one strong baseline that represents current SOTA or near-SOTA in the specific sub-area. Check recent NeurIPS/ICML/ICLR papers to identify appropriate baselines.
      - Benchmarks MUST be standard and actively used. If a benchmark has been superseded, use the newer version.
      - For each baseline, cite the original paper and note why it is a fair and competitive comparison.

      HYPOTHESIS ALIGNMENT (CRITICAL — most common failure mode):
      - Your experiment plan MUST directly test the hypotheses listed above.
      - Each hypothesis should map to at least one comparison between conditions.
      - Baselines must be the specific alternatives named in the hypotheses, NOT generic optimization methods like random_search or bayesian_optimization.
      - If a hypothesis says 'X outperforms Y', then X must be a proposed_method and Y must be a baseline.
      - Ablations must isolate the specific components claimed to matter in the hypotheses (e.g., if hypothesis claims routing helps, ablate routing).

      STABILITY & REPRODUCIBILITY (CRITICAL for RL-based methods):
      - Under `proposed_methods`, specify key hyperparameters (learning rate, gradient clip threshold, entropy coefficient, etc.).
      - Under `risks`, explicitly list numerical stability concerns (NaN/divergence, reward explosion, policy collapse) and mitigations (gradient clipping, reward normalization, early stopping on NaN).
      - Under `metrics`, include:
        * Primary metric: `{metric_key}` with direction: `{metric_direction}` and units
        * IMPORTANT: The metric direction MUST be `{metric_direction}` — do NOT use a different direction. If {metric_direction}=='minimize', lower is better. If {metric_direction}=='maximize', higher is better.
        * `success_rate`: fraction of seeds that complete without NaN/crash
        * At least ONE discovery-aligned endpoint (e.g., identification accuracy, time-to-discovery, final posterior mass on true hypothesis) in addition to any proxy metric
      {dataset_guidance}

      - Under `datasets`, specify AT LEAST 2 regime factors to stratify by (e.g., noise_level: [low, high], hypothesis_space_size: [small, large]). Results MUST be reported per-regime. A single-regime experiment cannot support generality claims and will be rejected by reviewers.
      - FACTORIAL DESIGN PREFERRED: If you vary multiple factors (e.g., scale AND noise), design a factorial grid (e.g., small+low, small+high, large+low, large+high) so each factor's effect can be isolated. Bundling factors (e.g., easy=small+low, hard=large+high) is a confounder and reviewers will flag it. If computational budget limits the grid, at minimum acknowledge that factors are bundled and limit claims accordingly.
      - Under `compute_budget`, plan for minimum 10 seeds per condition to ensure valid statistical comparisons.

      STATISTICAL POWER REQUIREMENTS (CRITICAL for publishability):
      - Use AT LEAST 5 random seeds per condition (10 preferred)
      - Use AT LEAST 30 episodes per seed for RL methods
      - Report: mean ± std, 95% bootstrap CI, per-seed raw values
      - For method comparisons: use paired bootstrap or Wilcoxon signed-rank test (NOT paired t-test with n < 10)
      - Report effect sizes (Cohen's d or rank-biserial correlation)
      - 3 seeds is INSUFFICIENT — reviewers will reject papers with n=3

      HARDWARE ENVIRONMENT (your experiments run on THIS exact machine):
      {hardware_profile}
      - You have exactly ONE GPU. No distributed training. No multi-GPU. No multi-node.
      - Design experiments that fit this single GPU.

      COMPUTE BUDGET CONSTRAINT (CRITICAL — experiments MUST fit time budget):
      - Total experiment time budget: {time_budget_sec} seconds.
      - Per-condition budget: ~{per_condition_budget_sec} seconds (= time_budget × 0.7 / 6 conditions).
      - Pre-cached datasets (instant, no download): {available_tier1_datasets}
      - DO NOT plan experiments requiring multiple GPUs or more than {time_budget_sec}s.
      - HARD CONDITION LIMIT: The total number of conditions (baselines + proposed_methods + ablations) MUST NOT exceed 8 for budgets ≤ 3600s.
        * Recommended: 2-3 baselines + 1-2 proposed methods + 2-3 ablations = 5-8 total.
        * Generating 10+ conditions guarantees most will time out and data will be wasted.
        * Quality over quantity: 6 well-run conditions with 5 seeds each >> 20 conditions with 1 seed each.
      - Each run needs AT LEAST 60 seconds for RL (environment setup + training + evaluation). For deep learning with GPU, at least 120 seconds.
      - HARD CAP: total_conditions × num_seeds × seconds_per_run MUST be < {time_budget_sec} × 0.8 (leave 20% margin for overhead).
      - If total would exceed the budget, you MUST reduce by:
        1. First: reduce conditions (merge similar ablations, keep strongest baselines)
        2. Then: reduce seeds to 5 (minimum for statistical validity)
        3. Then: reduce regimes/environments to 1
      - Example: {time_budget_sec}s budget with 120s/condition/seed, 5 seeds → max {time_budget_sec} / (120 * 5) ≈ 4 conditions.

      IMPLEMENTATION SPECIFICATION (CRITICAL for code generation):
      For each proposed method AND each baseline, you MUST include an 'implementation_spec' key with:
        - class_name: the Python class name for this method
        - key_methods: list of methods the class must implement (e.g., [__init__, forward, train_step, predict])
