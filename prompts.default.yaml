      ## Requirements
      1. `main.py` MUST be the entry point — runs ALL conditions sequentially.
      2. Each condition MUST be a SEPARATE class with DISTINCT implementation.
      3. Data loading and model definitions in separate modules.
      4. No more than 5 Python files total.
